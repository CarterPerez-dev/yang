name: Run pre-commit

permissions:
  contents: read

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  pre_commit_run:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install yang and pre-commit
        run: uv pip install . pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
