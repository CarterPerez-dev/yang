# .pre-commit-hooks.yaml

- id: yang
  name: yang
  description: "A maintained fork of YAPF that formats Python 3.14 code."
  entry: yang
  args: [-i]
  language: python
  types_or: [python, pyi]
  require_serial: false

- id: yang-diff
  name: yang-diff
  description: "Formats only the lines changed in the commit."
  always_run: true
  language: python
  pass_filenames: false
  stages: [pre-commit]
  entry: |
    bash -c "git diff -U0 --no-color --relative HEAD \
                  | yang-diff \
                  | tee >(git apply --allow-empty -p0)"
